# Упрощённый workflow для сборки Laigter под macOS.
# Основан на официальном .github/workflows/laigter-mac.yaml из репозитория,
# но без шагов публикации на itch.io (butler) — они нужны только мейнтейнеру.
#
# Куда положить: .github/workflows/laigter-mac.yaml в вашем репозитории.
#
# Результат запуска (вкладка Actions -> выбрать запуск -> Artifacts -> mac-artifacts):
#   laigter-mac.zip — laigter.app после macdeployqt (все Qt-библиотеки внутри).
#
# Запускается автоматически на каждый push и вручную кнопкой "Run workflow".
# macOS-latest сейчас — Apple Silicon (arm64); Qt 6 для macOS собирается
# как universal2, поэтому .app запускается и на Intel-маках.

name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  buildMac:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt (clang_64)
      uses: jurplel/install-qt-action@v4
      with:
        # 6.11.1 для macOS работает: разделение репозитория Qt по тулчейнам
        # (qt6_6111_mingw) касается только Windows
        version: '6.11.1'
        arch: 'clang_64'
        modules: 'qtimageformats'
        # Кэшировать установку Qt, чтобы повторные сборки не качали её заново
        cache: true

    - name: Build Laigter
      shell: bash
      env:
        # На теге приложение покажет номер тега вместо "dev"
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        qmake CONFIG+=release PREFIX=/usr $QMAKE_VERSION_ARG
        make -j$(nproc)
        make INSTALL_ROOT=appdir install
        find appdir/
        mkdir -p appdir/usr/lib
        macdeployqt laigter.app
        mkdir -p laigter-mac
        ditto laigter.app laigter-mac/laigter.app
        ditto -c -k --sequesterRsrc --keepParent laigter.app laigter-mac.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mac-artifacts
        path: laigter-mac.zip
