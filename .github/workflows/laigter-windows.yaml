# Упрощённый workflow для сборки Laigter под Windows.
# Основан на официальном .github/workflows/laigter-windows.yaml из репозитория,
# но без шагов публикации на itch.io (butler) — они нужны только мейнтейнеру.
#
# Куда положить: .github/workflows/laigter-windows.yaml в вашем репозитории
# (если строите Laigter в форке — скрипт упаковки dist/make-installer.ps1 уже есть в нём).
#
# Результат запуска (вкладка Actions -> выбрать запуск -> Artifacts -> win-artifacts):
#   laigter-windows/  — портативная версия: laigter.exe + все Qt/MinGW DLL
#   laigter-setup.exe — самораспаковывающийся установщик
#
# Запускается автоматически на каждый push и вручную кнопкой "Run workflow".

name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  buildWin:
    runs-on: windows-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v4
      with:
        # master требует Qt 6: в laigter.pro подключён модуль openglwidgets,
        # который есть только в Qt 6 (README с "Qt 5.14" устарел).
        # 6.11 пока нельзя: там репозиторий Qt разделён по тулчейнам
        # (qt6_6111_mingw вместо qt6_6111), а aqtinstall 3.3.0 ещё ищет старый путь.
        version: '6.10.2'
        arch: 'win64_mingw'
        target: 'desktop'
        host: 'windows'
        modules: 'qtimageformats'
        tools: 'tools_mingw1310'
        # Кэшировать установку Qt, чтобы повторные сборки не качали её заново (~10 мин)
        cache: true

    - name: Build
      shell: cmd
      env:
        # На теге приложение покажет номер тега вместо "dev"
        QMAKE_VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/') && format('VERSION={0}', github.ref_name) || '' }}
      run: |
        qmake CONFIG+=release %QMAKE_VERSION_ARG%
        make

    - name: Package (windeployqt + self-extracting installer)
      shell: cmd
      run: |
        powershell -ExecutionPolicy Bypass -File dist\make-installer.ps1 -Exe release\laigter.exe -OutFile laigter-setup.exe

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win-artifacts
        path: |
          laigter-windows
          laigter-setup.exe
